# Infra for local development. Not required for module 1 (which runs on SQLite),
# but wire this in when moving the datasource to Postgres and adding search/queues.
#
#   docker compose up -d
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: checkmate-postgres
    environment:
      POSTGRES_USER: checkmate
      POSTGRES_PASSWORD: checkmate
      POSTGRES_DB: checkmate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: checkmate-redis
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: checkmate-meili
    environment:
      MEILI_MASTER_KEY: dev-master-key-change-me
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

volumes:
  pgdata:
  meilidata:
